<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>黃色小鴨的名片</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.0.0/jquery.min.js"></script>
    <script>
        //==========================LIFF API初始化================================
       $(document).ready(function () {
            // 1. 初始化 LIFF
            liff.init({
                liffId: "2012022010-mk7EpNEw"
            }).then(() => {
                // 如果是在外部瀏覽器打開且未登入，引導登入
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // 2. 檢查 API 是否可用並自動觸發分享
                if (liff.isApiAvailable('shareTargetPicker')) {
                    autoShareAndClose();
                } else {
                    alert("目前環境無法使用 shareTargetPicker API，請確認後台設定或使用 LINE 打開！");
                }
            }).catch((err) => {
                console.error("LIFF 初始化失敗", err);
                alert("初始化失敗：" + err.message);
            });
        });

        // 自動分享並關閉視窗
        function autoShareAndClose() {
            // 這裡發送的是你的黃色小鴨名片卡片
            liff.shareTargetPicker([
                {
                    type: "flex",
                    altText: "靖雅的LINE名片",
                    contents: {
                        type: "carousel",
                        contents: [
                            {
                                type: "bubble",
                                size: "giga",
                                hero: {
                                    type: "image",
                                    size: "full",
                                    aspectMode: "fit",
                                    aspectRatio: "600:840",
                                    margin: "none",
                                    position: "relative",
                                    url: "https://r2.uploads.tw/2026/10/9ADknc9Kjd.webp",
                                    animated: false
                                },
                                body: {
                                    type: "box",
                                    layout: "horizontal",
                                    contents: [
                                        {
                                            type: "button",
                                            action: {
                                                type: "uri",
                                                label: "靖雅官網",
                                                uri: "https://joinus-tw.my.canva.site/?openExternalBrowser=1"
                                            },
                                            height: "md",
                                            style: "primary",
                                            color: "#fbc600",
                                            gravity: "center",
                                            margin: "none"
                                        },
                                        {
                                            type: "button",
                                            action: {
                                                type: "uri",
                                                label: "靖雅粉專",
                                                uri: "https://www.facebook.com/share/1F6Dfkc9X5/"
                                            },
                                            height: "md",
                                            style: "primary",
                                            margin: "xs",
                                            color: "#fbc600"
                                        },
                                        {
                                            type: "button",
                                            action: {
                                                type: "uri",
                                                label: "點我分享",
                                                uri: "https://joinus-tw520.pse.is/9r3jjx"
                                            },
                                            height: "md",
                                            style: "primary",
                                            margin: "xs",
                                            color: "#fbc600",
                                            position: "relative",
                                            gravity: "center",
                                            scaling: true,
                                            adjustMode: "shrink-to-fit"
                                        }
                                    ],
                                    position: "relative"
                                }
                            }
                        ]
                    }
                }
            ], {
                isMultiple: true,
            })
            .then((res) => {
                // 不論使用者點擊分享或是關閉選擇器，只要流程結束就關閉 LIFF 視窗
                if (liff.isInClient()) {
                    liff.closeWindow();
                }
            })
            .catch((err) => {
                console.error("分享出錯或取消:", err);
                // 出現異常或取消時也自動關閉
                if (liff.isInClient()) {
                    liff.closeWindow();
                }
            });
        }
    </script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f7f7;
            font-family: sans-serif;
            color: #666;
        }
        .loading-box {
            text-align: center;
        }
        //==========================LIFF API初始化================================

       

</html>
