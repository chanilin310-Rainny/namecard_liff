<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>黃色小鴨</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.0.0/jquery.min.js"></script>
    <script>
        //==========================LIFF API初始化================================
        $(document).ready(function() {
            liff.init({
                liffId:LIFF_ID
            });
        });
        //==========================LIFF API初始化================================

        function liff_getOS() {
            var OS = liff.getOS();
            alert(OS);
        }

        function liff_getLanguage() {
            var Language = liff.getLanguage();
            alert(Language);
        }

        function liff_getVersion() {
            var Version = liff.getVersion();
            alert(Version);
        }

        function liff_getLineVersion() {
            var LineVersion = liff.getLineVersion();
            alert(LineVersion);
        }

        function liff_isInClient() {
            var InClient = liff.isInClient();
            if (InClient != true) {
                alert("未使用LIFF瀏覽器");
            } else {
                alert("已使用LIFF瀏覽器");
            }
        }

        function liff_isLoggedIn() {
            var isLoggedIn = liff.isLoggedIn();
            if (isLoggedIn != true) {
                alert("未登入LINE");
            } else {
                alert("已登入LINE");
            }
        }

        function liff_login() {
            liff.login({
                redirectUri: "https://maso-personal.herokuapp.com/",
            });
        }

        function liff_logout() {
            liff.logout();
        }

        function liff_getAccessToken() {
            var accessToken = liff.getAccessToken();
            alert(accessToken);
        }

        function liff_getIDToken() {
            var IDToken = liff.getIDToken();
            alert(IDToken);
        }

        function liff_getDecodedIDToken() {
            var DecodedIDToken = JSON.stringify(liff.getDecodedIDToken());
            alert(DecodedIDToken);
        }

        function liff_getContext() {
            var Context = JSON.stringify(liff.getContext());
            alert(Context);
        }

        function liff_getProfile() {
            liff
                .getProfile()
                .then((profile) => {
                    alert(JSON.stringify(profile));
                })
                .catch((err) => {
                    console.log("error", err);
                });
        }

        function liff_getFriendship() {
            var Friendship = liff.getFriendship();
            alert(Friendship);
        }

        function liff_sendMessages() {
            liff.sendMessages([{
                type: "text",
                text: "這一則訊息是來自LIFF網頁",
            }, ]);
            alert("LIFF傳送訊息");
        }

        function liff_openWindow() {
            // window.location.replace("https://developers.line.biz/en/reference/liff/")
            liff.openWindow({
                url: "https://developers.line.biz/en/reference/liff/",
                external: true,
            });
        }

        function liff_closeWindow() {
            liff.closeWindow();
        }

        function liff_shareTargetPicker() {
            liff.shareTargetPicker(
                [{
                    type: "image",
                    originalContentUrl: "https://pic.pimg.tw/saryh777/1641637885-2419307650-g_n.png",
                    previewImageUrl: "https://pic.pimg.tw/saryh777/1641637885-2419307650-g_n.png",
                }, ], {
                    isMultiple: true,
                }
            );
        }

        function liff_LINE_Card() {
            liff.shareTargetPicker(
                [{
  "type": "carousel",
  "contents": [
    {
      "type": "bubble",
      "size": "giga",
      "hero": {
        "type": "image",
        "size": "full",
        "aspectMode": "fit",
        "aspectRatio": "600:840",
        "margin": "none",
        "position": "relative",
        "url": "https://hackmd-prod-images.s3.ap-northeast-1.amazonaws.com/uploads/b3793447-ca0d-4b63-8138-4de34a2be979.png?AWSAccessKeyId=AKIA3XSAAW6AWSKNINWO&Expires=1791989465&Signature=fQwPvFh6091U8kYqlS6srPnYUWs%3D",
        "animated": false
      },
      "body": {
        "type": "box",
        "layout": "horizontal",
        "contents": [
          {
            "type": "button",
            "action": {
              "type": "uri",
              "label": "靖雅官網",
              "uri": "https://joinus-tw.my.canva.site/?openExternalBrowser=1"
            },
            "height": "md",
            "style": "primary",
            "color": "#fbc600",
            "gravity": "center",
            "margin": "none"
          },
          {
            "type": "button",
            "action": {
              "type": "uri",
              "label": "靖雅粉專",
              "uri": "https://www.facebook.com/share/1F6Dfkc9X5/"
            },
            "height": "md",
            "style": "primary",
            "margin": "xs",
            "color": "#fbc600"
          },
          {
            "type": "button",
            "action": {
              "type": "uri",
              "label": "點我分享",
              "uri": "https://joinus-tw520.pse.is/9r3jjx"
            },
            "height": "md",
            "style": "primary",
            "margin": "xs",
            "color": "#fbc600",
            "position": "relative",
            "gravity": "center",
            "scaling": true,
            "adjustMode": "shrink-to-fit"
          }
        ],
        "position": "relative"
      }
    }
  ]
}], {
                    isMultiple: true,
                }
            );
        }

        function liff_isApiAvailable() {
            var apiName = "shareTargetPicker";
            var isApiAvailable = liff.isApiAvailable(apiName);
            if (isApiAvailable != true) {
                alert("無法使用" + apiName + " API");
            } else {
                alert("可以使用" + apiName + " API");
            }
        }
    </script>
    <style>
        h1 {
            width: 80%;
            height: 40px;
            margin-left: 10%;
        }
        
        button {
            width: 80%;
            height: 40px;
            margin-left: 10%;
            background-color: #c9e8e3;
            font-weight: 600;
        }
    </style>
</head>

<body>
    
    <h1>LIFF API測試範例：</h1>
    <h1></h1>
    <button onclick="liff_isInClient()">顯示是否在LIFF瀏覽器內</button
    ><br /><br />
    <button onclick="liff_isApiAvailable()">
      顯示是否此網頁可用liff.shareTargetPicker() API</button
    ><br /><br />
  
    <button onclick="liff_shareTargetPicker()">分享指定訊息</button><br /><br />
    <button onclick="liff_LINE_Card()">傳送LINE名片</button><br /><br />
    <br /><br />
</body>

</html>
